<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Taco</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b2a1b;
        overflow: hidden;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #girar {
        display: none;
        position: fixed;
        inset: 0;
        place-items: center;
        background: #1b2a1b;
        color: #fff;
        font: bold 24px sans-serif;
        text-align: center;
        padding: 16px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #girar {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="girar">Gire o celular para jogar 🔄</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
